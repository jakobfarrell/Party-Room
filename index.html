


<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Party Room</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            background: #111827;
            color: white;
            font-family: Arial, sans-serif;
            margin: 0;
            min-height: 100vh;
            padding: 30px 16px;
        }

        .container {
            background: #1f2937;
            border: 1px solid #374151;
            border-radius: 18px;
            padding: 32px;
            max-width: 650px;
            width: 100%;
            margin: 40px auto;
        }

        h1 {
            font-size: 36px;
            margin: 0 0 8px;
            text-align: center;
        }

        h2 {
            margin-top: 0;
        }

        .subtitle {
            color: #9ca3af;
            text-align: center;
            margin-bottom: 30px;
        }

        label {
            display: block;
            color: #d1d5db;
            font-size: 14px;
            margin-bottom: 8px;
        }

        input, select {
            width: 100%;
            padding: 13px;
            border: 1px solid #4b5563;
            border-radius: 8px;
            background: #111827;
            color: white;
            font-size: 16px;
            margin-bottom: 18px;
        }

        button {
            padding: 13px 18px;
            background: #7c3aed;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 15px;
            font-weight: bold;
            cursor: pointer;
        }

        button:hover {
            background: #6d28d9;
        }

        button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .full-button {
            width: 100%;
        }

        .secondary-button {
            background: #374151;
        }

        .secondary-button:hover {
            background: #4b5563;
        }

        .section {
            background: #111827;
            border: 1px solid #374151;
            border-radius: 12px;
            padding: 22px;
            margin-top: 20px;
        }

        .avatar-preview {
            font-size: 48px;
            text-align: center;
            margin-bottom: 12px;
        }

        .profile-heading {
            text-align: center;
            margin-bottom: 25px;
        }

        .profile-heading span {
            font-size: 40px;
        }

        .room-code {
            font-size: 34px;
            font-weight: bold;
            letter-spacing: 6px;
            text-align: center;
            color: #a78bfa;
            margin: 18px 0;
        }

        .player {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 13px;
            background: #1f2937;
            border-radius: 8px;
            margin-top: 10px;
        }

        .player-avatar {
            font-size: 28px;
        }

        .player-name {
            font-weight: bold;
        }

        .player-status {
            margin-left: auto;
            font-size: 12px;
            color: #4ade80;
        }

        #status {
            text-align: center;
            color: #fbbf24;
            margin-top: 20px;
            overflow-wrap: anywhere;
        }

        .hidden {
            display: none;
        }

        .divider {
            border: none;
            border-top: 1px solid #374151;
            margin: 24px 0;
        }

        .button-row {
            display: flex;
            gap: 10px;
        }

        .button-row button {
            flex: 1;
        }

        @media (max-width: 480px) {
            .container {
                padding: 22px;
            }

            .button-row {
                flex-direction: column;
            }
        }
    </style>
</head>

<body>

    <main class="container">

        <h1>🎮 Party Room</h1>
        <p class="subtitle">Your games. Your friends. Your party.</p>

        <!-- PROFILE SETUP -->
        <section id="profile-screen" class="hidden">

            <h2>Welcome! Create your player</h2>

            <div class="avatar-preview" id="avatar-preview">😎</div>

            <form id="profile-form">

                <label for="username">Username</label>
                <input
                    id="username"
                    type="text"
                    minlength="3"
                    maxlength="16"
                    placeholder="Choose a username"
                    required
                    autocomplete="off"
                >

                <label for="avatar">Choose your avatar</label>
                <select id="avatar">
                    <option value="😎">😎 Cool</option>
                    <option value="👾">👾 Alien</option>
                    <option value="🤖">🤖 Robot</option>
                    <option value="🐸">🐸 Frog</option>
                    <option value="🦊">🦊 Fox</option>
                    <option value="🐼">🐼 Panda</option>
                    <option value="👻">👻 Ghost</option>
                    <option value="🦄">🦄 Unicorn</option>
                    <option value="🐙">🐙 Octopus</option>
                    <option value="🦖">🦖 Dinosaur</option>
                    <option value="🐧">🐧 Penguin</option>
                    <option value="🐱">🐱 Cat</option>
                    <option value="🐶">🐶 Dog</option>
                    <option value="🍕">🍕 Pizza</option>
                    <option value="💀">💀 Skull</option>
                </select>

                <button type="submit" class="full-button" id="profile-button">
                    Create Player Profile
                </button>

            </form>
        </section>

        <!-- MAIN MENU -->
        <section id="home-screen" class="hidden">

            <div class="profile-heading">
                <span id="home-avatar">😎</span>
                <h2 id="home-username">Player</h2>
                <p class="subtitle">Welcome to Party Room!</p>
            </div>
            <div style="text-align:center; margin-bottom:20px;">
    <button id="edit-profile-button" class="secondary-button">
        Edit Profile
    </button>
</div>

<div id="edit-profile-panel" class="section hidden">
    <h2>Edit Your Profile</h2>

    <form id="edit-profile-form">

        <label for="edit-username">Username</label>
        <input
            id="edit-username"
            type="text"
            minlength="3"
            maxlength="16"
            required
            autocomplete="off"
        >

        <label for="edit-avatar">Choose your avatar</label>
        <select id="edit-avatar">
            <option value="😎">😎 Cool</option>
            <option value="👾">👾 Alien</option>
            <option value="🤖">🤖 Robot</option>
            <option value="🐸">🐸 Frog</option>
            <option value="🦊">🦊 Fox</option>
            <option value="🐼">🐼 Panda</option>
            <option value="👻">👻 Ghost</option>
            <option value="🦄">🦄 Unicorn</option>
            <option value="🐙">🐙 Octopus</option>
            <option value="🦖">🦖 Dinosaur</option>
            <option value="🐧">🐧 Penguin</option>
            <option value="🐱">🐱 Cat</option>
            <option value="🐶">🐶 Dog</option>
            <option value="🍕">🍕 Pizza</option>
            <option value="💀">💀 Skull</option>
        </select>

        <div class="button-row">
            <button type="submit" id="save-profile-button">
                Save Changes
            </button>

            <button
                type="button"
                id="cancel-edit-button"
                class="secondary-button"
            >
                Cancel
            </button>
        </div>

    </form>
</div>

            <div class="section">
                <h2>Create a Room</h2>

                <label for="room-name">Room name</label>
                <input
                    id="room-name"
                    type="text"
                    maxlength="30"
                    placeholder="Game Night"
                    value="Game Night"
                >

                <button id="create-room-button" class="full-button">
                    Create Private Room
                </button>
            </div>

            <div class="section">
                <h2>Join a Room</h2>

                <label for="room-code-input">Enter room code</label>
                <input
                    id="room-code-input"
                    type="text"
                    maxlength="6"
                    placeholder="ABC123"
                    autocomplete="off"
                >

                <button id="join-room-button" class="full-button">
                    Join Room
                </button>
            </div>

        </section>

        <!-- ROOM LOBBY -->
        <section id="room-screen" class="hidden">

            <h2 id="room-title">Game Night</h2>
            <p class="subtitle">Share this code with your friends.</p>

            <div class="room-code" id="display-room-code"></div>

            <div style="text-align:center;">
                <button id="copy-code-button" class="secondary-button">
                    Copy Room Code
                </button>
            </div>

            <div class="section">
                <h2>Players <span id="player-count">(0)</span></h2>
                <div id="player-list"></div>
            </div>

            <p id="host-message" class="subtitle"></p>

            <div style="text-align:center; margin: 20px 0;">
                <button id="ready-button" class="full-button">
                    Mark Ready
                </button>
            
                <button
                    id="start-game-button"
                    class="full-button"
                    style="margin-top: 12px;"
                    disabled
                >
                    Start Game
                </button>
            
                <p id="start-game-message" class="subtitle">
                    Waiting for all players to be ready.
                </p>
            </div>

<button id="leave-room-button" class="secondary-button full-button">
    Return to Main Menu
</button>

        </section>

        <p id="status">Connecting to Party Room...</p>

    </main>

    <script type="module">

        import { auth, database } from "./js/firebase-config.js";

        import {
            signInAnonymously,
            onAuthStateChanged
        } from "https://www.gstatic.com/firebasejs/13.1.0/firebase-auth.js";

        import {
            ref,
            get,
            set,
            update
        } from "https://www.gstatic.com/firebasejs/13.1.0/firebase-database.js";

        import {
            createRoom,
            joinRoom,
            listenToRoom
        } from "./js/room-manager.js";


        // HTML elements
        const profileScreen = document.getElementById("profile-screen");
        const homeScreen = document.getElementById("home-screen");
        const roomScreen = document.getElementById("room-screen");

        const status = document.getElementById("status");

        const profileForm = document.getElementById("profile-form");
        const usernameInput = document.getElementById("username");
        const avatarInput = document.getElementById("avatar");
        const avatarPreview = document.getElementById("avatar-preview");

        const createButton = document.getElementById("create-room-button");
        const joinButton = document.getElementById("join-room-button");
        const readyButton = document.getElementById("ready-button");
        const startGameButton = document.getElementById("start-game-button");
        const startGameMessage = document.getElementById("start-game-message");
        const editProfileButton = document.getElementById("edit-profile-button");
        const editProfilePanel = document.getElementById("edit-profile-panel");
        const editProfileForm = document.getElementById("edit-profile-form");
        const editUsernameInput = document.getElementById("edit-username");
        const editAvatarInput = document.getElementById("edit-avatar");
        const saveProfileButton = document.getElementById("save-profile-button");
        const cancelEditButton = document.getElementById("cancel-edit-button");

        let currentUser = null;
        let currentProfile = null;
        let currentRoomCode = null;
        let stopListeningToRoom = null;
        let currentPlayerReady = false;


        // Display one screen at a time
        function showScreen(screen) {
            profileScreen.classList.add("hidden");
            homeScreen.classList.add("hidden");
            roomScreen.classList.add("hidden");

            screen.classList.remove("hidden");
        }


        function showStatus(message, color = "#fbbf24") {
            status.textContent = message;
            status.style.color = color;
        }


        // Load the saved player profile
        async function loadPlayerProfile(user) {

            const profileRef = ref(
                database,
                "players/" + user.uid
            );

            const snapshot = await get(profileRef);

            if (snapshot.exists()) {
                currentProfile = snapshot.val();
                showHomeScreen();
            } else {
                showScreen(profileScreen);
                showStatus("Choose your username and avatar.");
            }
        }


        // Show the main menu
        function showHomeScreen() {

            document.getElementById("home-avatar").textContent =
                currentProfile.avatar;

            document.getElementById("home-username").textContent =
                currentProfile.username;

            showScreen(homeScreen);
            showStatus("Ready to play!", "#4ade80");
        }


        // Update avatar preview
        avatarInput.addEventListener("change", () => {
            avatarPreview.textContent = avatarInput.value;
        });


        // Create a new player profile
        profileForm.addEventListener("submit", async (event) => {

            event.preventDefault();

            const username = usernameInput.value.trim();
            const avatar = avatarInput.value;

            if (username.length < 3 || username.length > 16) {
                showStatus("Username must be 3–16 characters.", "#f87171");
                return;
            }

            const button = document.getElementById("profile-button");
            button.disabled = true;

            try {

                const profile = {
                    username: username,
                    avatar: avatar,
                    createdAt: Date.now()
                };

                await set(
                    ref(database, "players/" + currentUser.uid),
                    profile
                );

                currentProfile = profile;
                showHomeScreen();

            } catch (error) {

                console.error(error);
                showStatus("Could not save profile: " + error.message, "#f87171");

            }

            button.disabled = false;
        });

        // Open the profile editor
editProfileButton.addEventListener("click", () => {

    editUsernameInput.value = currentProfile.username;
    editAvatarInput.value = currentProfile.avatar;

    editProfilePanel.classList.remove("hidden");

    showStatus("Edit your username or avatar.");

});


// Cancel profile editing
cancelEditButton.addEventListener("click", () => {

    editProfilePanel.classList.add("hidden");

    showStatus("Profile editing cancelled.", "#9ca3af");

});


// Save updated player profile
editProfileForm.addEventListener("submit", async (event) => {

    event.preventDefault();

    const username = editUsernameInput.value.trim();
    const avatar = editAvatarInput.value;

    if (username.length < 3 || username.length > 16) {
        showStatus("Username must be 3–16 characters.", "#f87171");
        return;
    }

    saveProfileButton.disabled = true;

    showStatus("Saving profile changes...");

    try {

        const updatedProfile = {
            username: username,
            avatar: avatar,
            createdAt: currentProfile.createdAt || Date.now()
        };

        await set(
            ref(database, "players/" + currentUser.uid),
            updatedProfile
        );

        currentProfile = updatedProfile;

        document.getElementById("home-username").textContent =
            updatedProfile.username;

        document.getElementById("home-avatar").textContent =
            updatedProfile.avatar;

        editProfilePanel.classList.add("hidden");

        showStatus("Profile updated successfully!", "#4ade80");

    } catch (error) {

        console.error(error);

        showStatus(
            "Could not update profile: " + error.message,
            "#f87171"
        );

    }

    saveProfileButton.disabled = false;

});
        // Create a private room
        createButton.addEventListener("click", async () => {

            createButton.disabled = true;
            showStatus("Creating your room...");

            try {

                const roomName =
                    document.getElementById("room-name").value;

                const roomCode = await createRoom(
                    currentProfile,
                    roomName
                );

                openRoom(roomCode);

            } catch (error) {

                console.error(error);
                showStatus("Room creation failed: " + error.message, "#f87171");

            }

            createButton.disabled = false;
        });


        // Join an existing room
        joinButton.addEventListener("click", async () => {

            joinButton.disabled = true;
            showStatus("Joining room...");

            try {

                const roomCode =
                    document.getElementById("room-code-input").value;

                const joinedCode = await joinRoom(
                    roomCode,
                    currentProfile
                );

                openRoom(joinedCode);

            } catch (error) {

                console.error(error);
                showStatus("Could not join room: " + error.message, "#f87171");

            }

            joinButton.disabled = false;
        });


        // Open a room and listen for live changes
        function openRoom(roomCode) {

            currentRoomCode = roomCode;

            document.getElementById("display-room-code").textContent =
                roomCode;

            showScreen(roomScreen);
            showStatus("Connected to room!", "#4ade80");

            if (stopListeningToRoom) {
                stopListeningToRoom();
            }

            stopListeningToRoom = listenToRoom(
                roomCode,
                (roomData) => {

                    if (!roomData) {
                        showStatus("This room no longer exists.", "#f87171");
                        return;
                    }

                    const info = roomData.info || {};
                    const members = roomData.members || {};
                    currentPlayerReady =
                        members[currentUser.uid]?.ready === true;
                    
                    readyButton.textContent = currentPlayerReady
                        ? "Set Not Ready"
                        : "Mark Ready";

                    document.getElementById("room-title").textContent =
                        info.roomName || "Game Night";

                    const playerList =
                        document.getElementById("player-list");

                    playerList.replaceChildren();

                    const players = Object.entries(members);

                    document.getElementById("player-count").textContent =
                        "(" + players.length + ")";

                    players.forEach(([uid, player]) => {

                        const playerRow = document.createElement("div");
                        playerRow.className = "player";

                        const avatar = document.createElement("span");
                        avatar.className = "player-avatar";
                        avatar.textContent = player.avatar || "🙂";

                        const name = document.createElement("span");
                        name.className = "player-name";
                        name.textContent = player.username || "Player";

                        const playerStatus = document.createElement("span");
                        playerStatus.className = "player-status";

                        if (uid === info.hostUid) {
                            playerStatus.textContent = player.ready
                                ? "HOST · READY"
                                : "HOST · NOT READY";
                        } else if (player.ready) {
                            playerStatus.textContent = "READY";
                        } else {
                            playerStatus.textContent = "NOT READY";
                        }

                        playerRow.append(
                            avatar,
                            name,
                            playerStatus
                        );

                        playerList.appendChild(playerRow);

                    });

                    const isHost = info.hostUid === currentUser.uid;
                    // Check whether everyone is ready.
                    const allPlayersReady =
                        players.length >= 2 &&
                        players.every(([uid, player]) => player.ready === true);
                    
                    // Check whether the game has already been started.
                    const gameStarted = info.gameStarted === true;
                    
                    // Only the host can start the game, and only when everyone is ready.
                    startGameButton.disabled =
                        !isHost || !allPlayersReady || gameStarted;
                    
                    if (!isHost) {
                    
                        startGameButton.textContent = "Host Controls Game";
                    
                    } else if (gameStarted) {
                    
                        startGameButton.textContent = "Game Started";
                    
                    } else {
                    
                        startGameButton.textContent = "Start Game";
                    
                    }
                    
                    // Update the instructions underneath the button.
                    if (gameStarted) {
                    
                        startGameMessage.textContent =
                            "The host has started the game!";
                    
                    } else if (!isHost) {
                    
                        startGameMessage.textContent =
                            "Waiting for the host to start the game.";
                    
                    } else if (players.length < 2) {
                    
                        startGameMessage.textContent =
                            "At least two players are needed.";
                    
                    } else if (!allPlayersReady) {
                    
                        startGameMessage.textContent =
                            "Waiting for all players to be ready.";
                    
                    } else {
                    
                        startGameMessage.textContent =
                            "Everyone is ready! You can start the game.";
                    
                    }

                    document.getElementById("host-message").textContent =
                        isHost
                            ? "You are the room host."
                            : "Waiting for the host to start the game.";

                }
            );
        }

        // Update the ready button whenever room information changes
readyButton.textContent = currentPlayerReady
    ? "Set Not Ready"
    : "Mark Ready";


// Toggle the player's ready status
readyButton.addEventListener("click", async () => {

    if (!currentRoomCode || !currentUser) {
        return;
    }

    const newReadyState = !currentPlayerReady;

    readyButton.disabled = true;

    try {

        await update(
            ref(
                database,
                "rooms/" + currentRoomCode +
                "/members/" + currentUser.uid
            ),
            {
                ready: newReadyState
            }
        );

        showStatus(
            newReadyState
                ? "You are ready!"
                : "You are no longer ready.",
            "#4ade80"
        );

    } catch (error) {

        console.error(error);

        showStatus(
            "Could not update ready status: " + error.message,
            "#f87171"
        );

    }

    readyButton.disabled = false;

});
        // Start the game (host only)
startGameButton.addEventListener("click", async () => {

    if (!currentRoomCode || !currentUser) {
        return;
    }

    startGameButton.disabled = true;

    try {

        const roomRef = ref(
            database,
            "rooms/" + currentRoomCode + "/info"
        );

        await update(roomRef, {
            gameStarted: true,
            startedAt: Date.now()
        });

        showStatus("Game started!", "#4ade80");

    } catch (error) {

        console.error(error);

        showStatus(
            "Could not start the game: " + error.message,
            "#f87171"
        );

    }

});
        // Copy room code
        document.getElementById("copy-code-button")
            .addEventListener("click", async () => {

                try {
                    await navigator.clipboard.writeText(currentRoomCode);
                    showStatus("Room code copied!", "#4ade80");
                } catch (error) {
                    showStatus("Copy failed. Please copy the code manually.", "#f87171");
                }

            });


        // Return to the main menu
        document.getElementById("leave-room-button")
            .addEventListener("click", () => {

                if (stopListeningToRoom) {
                    stopListeningToRoom();
                    stopListeningToRoom = null;
                }

                currentRoomCode = null;

                showHomeScreen();

            });


        // Firebase authentication
        
// Firebase authentication
onAuthStateChanged(auth, async (user) => {

    if (!user) {
        showStatus("Signing in...");

        try {
            await signInAnonymously(auth);
        } catch (error) {
            console.error(error);
            showStatus("Authentication failed: " + error.message, "#f87171");
        }

        return;
    }

    currentUser = user;

    try {
        await loadPlayerProfile(user);
    } catch (error) {
        console.error(error);
        showStatus("Could not load your profile: " + error.message, "#f87171");
    }

});


    </script>

</body>
</html>
